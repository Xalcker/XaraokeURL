<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XaraokeURL Host</title>
    <meta name="theme-color" content="#171124">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml" sizes="any">
    <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/icons.css">
    <link rel="stylesheet" href="css/host.css">
    <script>
        (function() {
            const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
            if (isMobile) {
                window.location.href = '/remote.html';
            }
        })();
    </script>
</head>
<body>
    <div id="welcome-modal">
        <img class="brand-logo" src="img/logo.svg" alt="" width="128" height="128">
        <h1>XaraokeURL</h1>
        <p>Haz clic para iniciar la sesión</p>
        <button id="start-btn">Comenzar</button>
    </div>

    <div class="main-container hidden">
        <div class="sidebar-left">
            <div id="now-playing" class="sidebar-section">
                <h3><span data-icon="mic"></span>Ahora Suena</h3>
                <div id="now-playing-content">
                    <div class="info-card-title">Cargando...</div>
                    <div class="info-card-user"></div>
                    <div class="info-card-subtitle"></div>
                </div>
            </div>
            <div id="up-next" class="sidebar-section">
                <h3><span data-icon="next"></span>A Continuación</h3>
                <div id="up-next-content">
                    <div class="info-card-title">Nadie en espera</div>
                </div>
            </div>
        </div>
        
        <div class="player-column">
            <!-- <video id="karaokePlayer" controls controlslist="nodownload" autoplay></video> -->
             <video oncontextmenu="return false;" id="karaokePlayer"></video>
        </div>
        
        <div class="sidebar-right">
            <div id="queue-container" class="sidebar-section">
                <h3><span data-icon="list"></span>Próximas 5 Canciones</h3>
                <div id="songQueue"></div>
            </div>
            <div id="qr-container" class="sidebar-section">
                <h3><span data-icon="phone"></span>Control Remoto</h3>
                <p style="text-align: center; margin-bottom: 0.5rem; font-size: 1.2rem; font-weight: bold;">Sala:</p> 
                <div id="room-code">----</div>
                <p>Escanea para añadir canciones</p>
                <img id="qrCode" alt="Código QR del control remoto">
                <p id="qr-error" class="hidden">No se pudo generar el QR. Entra manualmente a <strong>/remote.html</strong> desde tu teléfono.</p>
            </div>
        </div>
    </div>
    <script src="js/icons.js"></script>
    <script src="js/shared.js"></script>
    <script src="karaoke.js"></script>
</body>
</html>
